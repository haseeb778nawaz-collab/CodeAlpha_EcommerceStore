<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kora | Good things for everyday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <a href="#/" class="logo">kora<span>.</span></a>
  <input id="search" type="search" placeholder="Search watches, bags, headphones" aria-label="Search products">
  <nav>
    <a href="#/orders" id="ordersLink">My orders</a>
    <button id="accountBtn" class="ghost">Log in</button>
    <button id="cartBtn" class="cartbtn" aria-label="Open cart">Cart <b id="cartCount">0</b></button>
  </nav>
</header>

<main id="view"></main>

<footer class="foot">
  <div><strong>kora.</strong> Honest goods, delivered across Pakistan.</div>
  <div>Free delivery over Rs 5,000 &nbsp;|&nbsp; 7-day returns &nbsp;|&nbsp; Cash on delivery</div>
</footer>

<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-label="Shopping cart">
  <div class="drawer-head"><h2>Your cart</h2><button id="closeCart" class="ghost" aria-label="Close cart">Close</button></div>
  <div id="cartItems" class="drawer-body"></div>
  <div id="cartFoot" class="drawer-foot"></div>
</aside>

<dialog id="authDialog">
  <form id="authForm" method="dialog">
    <h2 id="authTitle">Log in</h2>
    <label id="nameRow">Full name<input name="name" autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
    <p id="authError" class="error" role="alert"></p>
    <button class="primary" type="submit" id="authSubmit">Log in</button>
    <p class="switch"><span id="authSwitchText">New here?</span> <a href="#" id="authSwitch">Create an account</a></p>
    <button type="button" class="ghost close-x" id="authClose">Cancel</button>
  </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
